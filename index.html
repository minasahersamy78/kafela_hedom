<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>معرض الهدوم - إدارة المخزون</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #000000; 
            color: #4facfe; 
            padding: 20px; 
            max-width: 900px; 
            margin: auto;
            position: relative;
            overflow-x: hidden;
        }

        /* أنيميشن الخلفية (أيقونات عائمة) */
        .clothes-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .float-icon {
            position: absolute;
            color: #0a2e5c;
            opacity: 0.3;
            font-size: 50px;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0.1; }
            50% { opacity: 0.3; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        .header { 
            text-align: center; 
            padding: 40px 20px; 
            background: rgba(10, 46, 92, 0.5); 
            backdrop-filter: blur(10px);
            color: #4facfe; 
            border-radius: 25px; 
            margin-bottom: 30px; 
            border: 1px solid #4facfe;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4); 
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.1) 0%, transparent 70%);
            z-index: 0;
        }

        .header h1 { margin: 0; font-size: 3em; font-weight: 700; text-shadow: 0 0 10px #4facfe; position: relative; z-index: 1; }
        .header p { margin: 15px 0 0; font-size: 1.3em; opacity: 0.9; position: relative; z-index: 1; text-shadow: 0 0 5px #4facfe; }

        .controls { 
            background: rgba(10, 10, 10, 0.8); 
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.2); 
            margin-bottom: 30px; 
            border-top: 2px solid #4facfe; 
            border-left: 1px solid #1e3a8a;
            border-right: 1px solid #1e3a8a;
            border-bottom: 1px solid #1e3a8a;
            backdrop-filter: blur(5px);
        }
        .controls h3 { margin-top: 0; color: #4facfe; font-size: 1.6em; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 5px #4facfe; }
        
        label { font-weight: 600; color: #4facfe; margin-bottom: 8px; display: block; text-shadow: 0 0 2px #4facfe; }
        select, input { 
            padding: 15px; 
            border: 2px solid #1e3a8a; 
            border-radius: 15px; 
            font-family: 'Cairo', sans-serif; 
            font-size: 16px; 
            width: 100%; 
            box-sizing: border-box; 
            transition: all 0.4s ease; 
            background-color: rgba(0, 0, 0, 0.5);
            color: #4facfe;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }
        select:focus, input:focus { 
            border-color: #4facfe; 
            outline: none; 
            background-color: #000;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.5); 
        }

        .flex-container { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 200px; }

        .btn-group { display: flex; gap: 20px; margin-top: 30px; width: 100%; }
        button { 
            font-family: 'Cairo', sans-serif; 
            cursor: pointer; 
            padding: 16px 20px; 
            font-size: 18px; 
            font-weight: bold; 
            border: none; 
            border-radius: 15px; 
            flex: 1; 
            color: #000000; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
        }
        .btn-add { 
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); 
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4); 
        }
        .btn-add:hover { transform: scale(1.05); box-shadow: 0 0 20px #4facfe; color: white; }
        .btn-add:disabled { background: #1e3a8a; color: #888; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .btn-delete { 
            background: transparent;
            color: #4facfe;
            border: 2px solid #4facfe;
            box-shadow: 0 5px 15px rgba(30, 58, 138, 0.3); 
        }
        .btn-delete:hover { background: #4facfe; color: #000; transform: scale(1.05); box-shadow: 0 0 20px #4facfe; }
        .btn-delete:disabled { background: #111; color: #555; border-color: #333; cursor: not-allowed; transform: none; box-shadow: none; }

        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0; 
            background: rgba(10, 10, 10, 0.8); 
            border-radius: 25px; 
            overflow: hidden; 
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.2); 
            border: 1px solid #1e3a8a;
            backdrop-filter: blur(5px);
        }
        th, td { padding: 20px 15px; text-align: center; border-bottom: 1px solid #1e3a8a; }
        th { background: rgba(2, 15, 38, 0.8); color: #4facfe; font-weight: 700; font-size: 1.2em; text-transform: uppercase; letter-spacing: 1px; }
        tr:last-child td { border-bottom: none; }
        tbody tr { transition: background-color 0.4s ease; }
        tbody tr:hover { background-color: rgba(17, 34, 51, 0.6); }
        
        .total-row { 
            background: rgba(2, 15, 38, 0.8); 
            font-weight: bold; 
            font-size: 1.3em; 
            color: #4facfe; 
        }
        
        .loading {
            padding: 40px;
            color: #4facfe;
            font-weight: bold;
            font-size: 1.4em;
            text-shadow: 0 0 10px #4facfe;
        }

        /* رسالة التنبيه */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 46, 92, 0.9);
            color: #4facfe;
            padding: 15px 30px;
            border-radius: 30px;
            border: 1px solid #4facfe;
            box-shadow: 0 0 15px #4facfe;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="clothes-bg" id="bgIcons"></div>

    <div class="header">
        <h1>👗 معرض الهدوم 👕</h1>
        <p>النظام الذكي لإدارة المخزون السريع والسهل</p>
    </div>

    <div class="controls">
        <h3>🛒 تحديث المخزون (إضافة أو خصم)</h3>
        
        <div class="input-group" style="margin-top: 15px;">
            <label>اختر الصنف من الملابس:</label>
            <select id="categorySelect"></select>
        </div>
        
        <div class="flex-container">
            <div class="input-group">
                <label>📦 عدد الباليتات:</label>
                <input type="number" id="balesInput" value="0">
            </div>
            <div class="input-group">
                <label>🏷️ عدد القطع:</label>
                <input type="number" id="piecesInput" value="0">
            </div>
        </div>
        
        <div class="btn-group">
            <button onclick="updateInventory('add')" class="btn-add" id="addBtn">➕ إضافة للمخزون</button>
            <button onclick="updateInventory('subtract')" class="btn-delete" id="subBtn">➖ خصم من المخزون</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>نوع الملابس</th>
                <th>عدد البريتات</th>
                <th>عدد القطع</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="3" class="loading">⏳ جاري تحميل أحدث بيانات المعرض...</td></tr>
        </tbody>
        <tfoot>
            <tr class="total-row">
                <td>الإجمالي الكلي</td>
                <td id="totalBales">0</td>
                <td id="totalPieces">0</td>
            </tr>
        </tfoot>
    </table>

    <div id="toast" class="toast"></div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwlpfxpcpoYrUOe9w0wq0zu1lc6O75YGUD9tqGmmHU8o4kDDtbCZTSkI3OcAXt-fDWXFw/exec';

        // إنشاء أيقونات عائمة في الخلفية
        const bgIcons = document.getElementById('bgIcons');
        const icons = ['👗', '👕', '👖', '🧥', '👚', '👔'];
        for (let i = 0; i < 20; i++) {
            const span = document.createElement('span');
            span.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            span.className = 'float-icon';
            span.style.left = Math.random() * 100 + '%';
            span.style.animationDuration = (Math.random() * 10 + 10) + 's';
            span.style.animationDelay = Math.random() * 5 + 's';
            span.style.fontSize = (Math.random() * 30 + 30) + 'px';
            bgIcons.appendChild(span);
        }

        function showMessage(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        async function loadData() {
            try {
                const response = await fetch(scriptURL);
                const data = await response.json();
                
                const tbody = document.getElementById('tableBody');
                const select = document.getElementById('categorySelect');
                
                tbody.innerHTML = '';
                
                if (select.options.length === 0) {
                    data.forEach(item => {
                        if (item.category && item.category !== "الإجمالي الكلي") {
                            let option = document.createElement('option');
                            option.value = item.category;
                            option.textContent = item.category;
                            select.appendChild(option);
                        }
                    });
                }
                
                let totalBales = 0;
                let totalPieces = 0;

                data.forEach(item => {
                    if (item.category && item.category !== "الإجمالي الكلي") {
                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td style="font-weight: 600;">${item.category}</td>
                            <td style="font-size: 1.1em;">${item.bales}</td>
                            <td style="font-size: 1.1em;">${item.pieces}</td>
                        `;
                        tbody.appendChild(tr);

                        totalBales += item.bales;
                        totalPieces += item.pieces;
                    }
                });

                document.getElementById('totalBales').textContent = totalBales;
                document.getElementById('totalPieces').textContent = totalPieces;
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="3" style="color: #ef4444; padding: 20px;">⚠️ حدث خطأ في الاتصال، تأكد من الإنترنت!</td></tr>';
            }
        }

        async function updateInventory(action) {
            document.getElementById('addBtn').disabled = true;
            document.getElementById('subBtn').disabled = true;
            
            const originalAddText = document.getElementById('addBtn').innerHTML;
            const originalSubText = document.getElementById('subBtn').innerHTML;
            
            if(action === 'add') {
                document.getElementById('addBtn').innerHTML = "⏳ جاري الإضافة...";
            } else {
                document.getElementById('subBtn').innerHTML = "⏳ جاري الخصم...";
            }

            const category = document.getElementById('categorySelect').value;
            let bales = parseInt(document.getElementById('balesInput').value) || 0;
            let pieces = parseInt(document.getElementById('piecesInput').value) || 0;

            if (action === 'subtract') {
                bales = -bales;
                pieces = -pieces;
            }

            let formData = new FormData();
            formData.append('category', category);
            formData.append('bales', bales);
            formData.append('pieces', pieces);

            try {
                await fetch(scriptURL, { method: 'POST', body: formData });
                
                document.getElementById('balesInput').value = 0;
                document.getElementById('piecesInput').value = 0;
                await loadData();
                showMessage(`تم تحديث ${category} بنجاح!`);
            } catch (error) {
                console.error('Error updating!', error);
                alert("⚠️ حدث خطأ أثناء التحديث!");
            } finally {
                document.getElementById('addBtn').disabled = false;
                document.getElementById('subBtn').disabled = false;
                document.getElementById('addBtn').innerHTML = originalAddText;
                document.getElementById('subBtn').innerHTML = originalSubText;
            }
        }

        loadData();
    </script>
</body>
</html>
